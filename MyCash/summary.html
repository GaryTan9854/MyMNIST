<table>
    <thead>
      <tr>
        {% for header_item in table_data[0] %}
        <th>{{ header_item }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in table_data[1:] %}
      <tr>
        {% for cell in row %}
        <td>{{ cell }}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
